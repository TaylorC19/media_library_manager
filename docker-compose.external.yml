# Optional alternative using an existing Atlas/replica-set database.
services:
  app:
    image: media-library-manager:local
    build:
      context: .
      target: app
    init: true
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      APP_ENV: production
      PORT: "8080"
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    healthcheck:
      test: [CMD, wget, -qO-, "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
  setup:
    image: media-library-manager-setup:local
    build:
      context: .
      target: setup
    restart: "no"
    env_file: [.env.setup]
    command: [database]
