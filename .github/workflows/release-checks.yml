name: Release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Disposable replica set
        run: |
          docker run -d --name mongo-test -p 27017:27017 mongo:7 mongod --replSet test --bind_ip_all
          for attempt in $(seq 1 30); do
            docker exec mongo-test mongosh --quiet --eval 'db.adminCommand({ping:1})' && break
            sleep 1
          done
          docker exec mongo-test mongosh --quiet --eval 'rs.initiate({_id:"test",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            docker exec mongo-test mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' && break
            sleep 1
          done
      - run: go test -race ./... -count=1
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=test
          REQUIRE_MONGO_TESTS: '1'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test scripts/*.test.cjs
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Linux production build and scan
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/mlm-server ./cmd/server
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary /tmp/mlm-server
      - name: Secret scan
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git --log-opts='--all --full-history' --redact=100 --no-banner
          gitleaks dir . --redact=100 --no-banner
