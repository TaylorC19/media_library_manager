{{ define "partials/language_switcher" }}
{{ $localePath := .Path }}{{ if .LocalePath }}{{ $localePath = .LocalePath }}{{ end }}
<nav class="language-switcher" aria-label="{{ t . "common.languageSwitcher.aria" }}">
  <span class="muted">{{ t . "common.languageSwitcher.label" }}:</span>
  <a data-locale-target="en" href="{{ swapLocale $localePath "en" }}" {{ if eq .Locale "en" }}aria-current="true"{{ end }}>{{ t . "common.languageSwitcher.en" }}</a>
  <a data-locale-target="ja" href="{{ swapLocale $localePath "ja" }}" {{ if eq .Locale "ja" }}aria-current="true"{{ end }}>{{ t . "common.languageSwitcher.ja" }}</a>
</nav>
{{ end }}
